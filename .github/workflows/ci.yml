name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # The newest Xcode 26 on the runner: images name them by version (Xcode_26.0.1.app, Xcode_26.1.app…),
      # and which ones are installed changes as GitHub updates them.
      - name: Select Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          echo "Using $xcode"
          sudo xcode-select -s "$xcode"
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build

      # Universal, as releases are, so a build that only breaks for one architecture shows here first.
      - name: Bundle the app
        run: ARCHS="arm64 x86_64" scripts/build-app.sh release
